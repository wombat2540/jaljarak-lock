<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>잘자락(Lock) Design System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Pretendard', sans-serif;
      background: #0D0D14;
      color: #F0EAF8;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 240px;
      min-width: 240px;
      background: #16161F;
      border-right: 1px solid #2A2A3E;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid #2A2A3E;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .sidebar-logo svg {
      width: 28px;
      height: 28px;
    }

    .sidebar-title {
      font-size: 16px;
      font-weight: 700;
      color: #F0EAF8;
      letter-spacing: -0.32px;
    }

    .sidebar-subtitle {
      font-size: 11px;
      color: #8A7FA0;
      letter-spacing: -0.22px;
      margin-top: 2px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 16px 0;
    }

    .nav-section {
      margin-bottom: 8px;
    }

    .nav-section-label {
      font-size: 10px;
      font-weight: 600;
      color: #4A4460;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 8px 20px 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      font-size: 13px;
      font-weight: 400;
      color: #8A7FA0;
      cursor: pointer;
      border-radius: 0;
      transition: all 0.15s ease;
      text-decoration: none;
      border-left: 2px solid transparent;
      letter-spacing: -0.26px;
    }

    .nav-item:hover {
      color: #C4B8D8;
      background: rgba(180, 142, 240, 0.06);
    }

    .nav-item.active {
      color: #B48EF0;
      font-weight: 600;
      background: rgba(180, 142, 240, 0.08);
      border-left-color: #B48EF0;
    }

    .nav-item i {
      width: 16px;
      font-size: 15px;
      text-align: center;
    }

    .content {
      flex: 1;
      overflow: hidden;
    }

    #content-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #0D0D14;
    }

    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      padding: 40px;
      text-align: center;
    }

    .welcome-motif {
      margin-bottom: 8px;
    }

    .welcome h1 {
      font-size: 28px;
      font-weight: 700;
      color: #F0EAF8;
      letter-spacing: -0.56px;
    }

    .welcome p {
      font-size: 15px;
      color: #8A7FA0;
      letter-spacing: -0.30px;
      max-width: 360px;
      line-height: 1.6;
    }

    .welcome-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }

    .welcome-tag {
      padding: 4px 12px;
      background: rgba(180, 142, 240, 0.1);
      border: 1px solid rgba(180, 142, 240, 0.2);
      border-radius: 9999px;
      font-size: 12px;
      color: #C4A0F4;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2A2A3E; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3D3D5C; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="14" cy="20" rx="3" ry="5" fill="#7EC8A4"/>
          <ellipse cx="14" cy="14" rx="3.5" ry="5.5" fill="#B48EF0" opacity="0.9"/>
          <ellipse cx="10" cy="12" rx="2.5" ry="4.5" fill="#C4A0F4" opacity="0.7" transform="rotate(-20 10 12)"/>
          <ellipse cx="18" cy="12" rx="2.5" ry="4.5" fill="#C4A0F4" opacity="0.7" transform="rotate(20 18 12)"/>
          <ellipse cx="8" cy="15" rx="2" ry="3.5" fill="#D4B8F8" opacity="0.5" transform="rotate(-35 8 15)"/>
          <ellipse cx="20" cy="15" rx="2" ry="3.5" fill="#D4B8F8" opacity="0.5" transform="rotate(35 20 15)"/>
        </svg>
        <span class="sidebar-title">잘자락</span>
      </div>
      <div class="sidebar-subtitle">Design System v1.0</div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-label">Foundation</div>
        <a class="nav-item" onclick="loadPage('foundation/color.html', this)">
          <i class="ph ph-palette"></i> Color
        </a>
        <a class="nav-item" onclick="loadPage('foundation/typography.html', this)">
          <i class="ph ph-text-aa"></i> Typography
        </a>
        <a class="nav-item" onclick="loadPage('foundation/spacing.html', this)">
          <i class="ph ph-arrows-out-simple"></i> Spacing
        </a>
        <a class="nav-item" onclick="loadPage('foundation/border-radius.html', this)">
          <i class="ph ph-square"></i> Border Radius
        </a>
        <a class="nav-item" onclick="loadPage('foundation/shadow.html', this)">
          <i class="ph ph-drop-shadow"></i> Shadow
        </a>
        <a class="nav-item" onclick="loadPage('foundation/icon.html', this)">
          <i class="ph ph-star"></i> Icon
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-section-label">Components</div>
        <a class="nav-item" onclick="loadPage('components/button.html', this)">
          <i class="ph ph-cursor-click"></i> Button
        </a>
        <a class="nav-item" onclick="loadPage('components/input-field.html', this)">
          <i class="ph ph-text-cursor"></i> Input Field
        </a>
        <a class="nav-item" onclick="loadPage('components/card.html', this)">
          <i class="ph ph-cards"></i> Card
        </a>
        <a class="nav-item" onclick="loadPage('components/toggle.html', this)">
          <i class="ph ph-toggle-left"></i> Toggle
        </a>
        <a class="nav-item" onclick="loadPage('components/progress-bar.html', this)">
          <i class="ph ph-chart-bar"></i> Progress Bar
        </a>
        <a class="nav-item" onclick="loadPage('components/badge.html', this)">
          <i class="ph ph-tag"></i> Badge
        </a>
        <a class="nav-item" onclick="loadPage('components/bottom-sheet.html', this)">
          <i class="ph ph-arrow-up"></i> Bottom Sheet
        </a>
        <a class="nav-item" onclick="loadPage('components/navigation-bar.html', this)">
          <i class="ph ph-navigation-arrow"></i> Navigation Bar
        </a>
      </div>
    </nav>
  </aside>

  <div class="content" id="content-area">
    <div class="welcome">
      <div class="welcome-motif">
        <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="36" cy="52" rx="6" ry="12" fill="#7EC8A4"/>
          <ellipse cx="36" cy="36" rx="9" ry="14" fill="#B48EF0" opacity="0.9"/>
          <ellipse cx="25" cy="30" rx="6.5" ry="11.5" fill="#C4A0F4" opacity="0.7" transform="rotate(-20 25 30)"/>
          <ellipse cx="47" cy="30" rx="6.5" ry="11.5" fill="#C4A0F4" opacity="0.7" transform="rotate(20 47 30)"/>
          <ellipse cx="20" cy="39" rx="5" ry="9" fill="#D4B8F8" opacity="0.5" transform="rotate(-35 20 39)"/>
          <ellipse cx="52" cy="39" rx="5" ry="9" fill="#D4B8F8" opacity="0.5" transform="rotate(35 52 39)"/>
          <circle cx="36" cy="36" r="34" stroke="rgba(180,142,240,0.1)" stroke-width="1"/>
        </svg>
      </div>
      <h1>잘자락 Design System</h1>
      <p>다크톤 수면 앱을 위한 디자인 시스템입니다.<br>왼쪽 사이드바에서 항목을 선택해 탐색하세요.</p>
      <div class="welcome-tags">
        <span class="welcome-tag">Pretendard</span>
        <span class="welcome-tag">Phosphor Icons</span>
        <span class="welcome-tag">라벤더 모티프</span>
        <span class="welcome-tag">다크 테마</span>
      </div>
    </div>
    <iframe id="content-frame" style="display:none;"></iframe>
  </div>

  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    function loadPage(path, el) {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');

      const welcome = document.querySelector('.welcome');
      const frame = document.getElementById('content-frame');

      welcome.style.display = 'none';
      frame.style.display = 'block';
      frame.src = path;
    }
  </script>
</body>
</html>
